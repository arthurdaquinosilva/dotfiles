# ============================================================================
# TMUX CONFIGURATION
# ============================================================================
# A well-documented, organized, and easy-to-maintain tmux configuration.
#
# Sections:
# 1. Core Settings: Basic tmux behavior and terminal integration.
# 2. Key Mappings: Custom keybindings for navigation, panes, and windows.
# 3. Popups: Keybindings for launching tools and commands in popups.
# 4. Appearance & Theme: Colors, status bar, and overall look and feel.
# 5. Plugins: Configuration for tmux plugins managed by TPM.
# ============================================================================

# ============================================================================
# 1. CORE SETTINGS
# ============================================================================

# Use tmux's own terminfo entry (correct italics, true color via terminal-features)
set -g default-terminal "tmux-256color"

# Disable the alternate screen so full-screen app output stays in scrollback
set -ga terminal-overrides ",xterm-256color:smcup@:rmcup@"

# Append (not replace) features for the outer terminal; iTerm2 3.x is also auto-detected
set -as terminal-features ",xterm-256color:RGB:hyperlinks:usstyle:overline:strikethrough:sync:extkeys"

# Report modified keys (C-Enter, S-Enter, C-i vs Tab) to apps using CSI u
set -s extended-keys on
set -s extended-keys-format csi-u

# Set the default shell to Zsh
set -g default-shell /bin/zsh

# Start window and pane numbering at 1 for easier access
set -g base-index 1
setw -g pane-base-index 1

# Keep tmux sessions alive even after the initial client disconnects
set -g detach-on-destroy off

# Remove the delay after pressing the Escape key
set -sg escape-time 0

# Enable focus events for applications like Neovim
set -g focus-events on

# Large but bounded scrollback (applies to existing panes since 3.7)
set -g history-limit 100000

# Enable mouse support for scrolling, pane selection, etc.
set -g mouse on

# Allow tmux to set the system clipboard via OSC 52
set -s set-clipboard on

# Let apps read the system clipboard via OSC 52 (and keep a paste buffer copy)
set -s get-clipboard both

# Allow DCS passthrough (e.g. inline images) for applications inside tmux
set -g allow-passthrough on

# Automatically renumber windows when a window is closed
set -g renumber-windows on

# Update the status bar every second
set -g status-interval 1

# Show a scrollbar only while in copy/view mode
set -g pane-scrollbars modal

# Vim-style hybrid line numbers in copy mode
set -g copy-mode-line-numbers hybrid

# ============================================================================
# 2. KEY MAPPINGS
# ============================================================================

# Use Vim-style keys for navigation and copy mode
setw -g mode-keys vi

# --- Pane Management ---
bind h select-pane -L     # Move to the pane on the left
bind j select-pane -D     # Move to the pane below
bind k select-pane -U     # Move to the pane above
bind l select-pane -R     # Move to the pane on the right

bind > swap-pane -D       # Swap current pane with the next one
bind < swap-pane -U       # Swap current pane with the previous one

bind -r H resize-pane -L 2 # Resize pane left
bind -r J resize-pane -D 2 # Resize pane down
bind -r K resize-pane -U 2 # Resize pane up
bind -r L resize-pane -R 2 # Resize pane right
bind -r m resize-pane -Z   # Toggle pane zoom

bind | split-window -h    # Split window horizontally
bind - split-window -v    # Split window vertically
bind x kill-pane          # Kill the current pane without confirmation

# --- Window Management ---
bind -r C-l next-window      # Go to the next window
bind -r C-h previous-window  # Go to the previous window
bind Tab last-window         # Switch to the last active window
unbind n                     # Unbind default 'n' for next-window
unbind p                     # Unbind default 'p' for previous-window

bind r command-prompt -I "rename-window " # Rename the current window
bind R source-file ~/.tmux.conf \; display-message "Config reloaded..." # Reload tmux config

# --- Session Management ---
bind C-s command-prompt -p find-session 'switch-client -t %%' # Switch session
bind d detach                # Detach from the current session (no -r: avoids accidental detach after resizing)

# ============================================================================
# 3. POPUPS
# ============================================================================
# Centralized popup bindings for quick access to tools.

# --- Development Tools ---
bind o display-popup -E -w 90% -h 90% 'tmux new-session -A -s new'        # New tmux session
bind N display-popup -E -w 90% -h 90% 'tmux new-session -A -s node-playground "node"' # Node.js playground
bind i display-popup -E -w 90% -h 90% 'tmux new-session -A -s ipython-session "source .venv/bin/activate && ipython"' # iPython session
bind P display-popup -E -w 90% -h 90% 'ipython'                            # iPython (no venv)
bind G display-popup -E -w 90% -h 90% 'lazygit'                            # Lazygit
bind t display-popup -E -w 90% -h 90% 'htop'                               # htop

# --- Git Operations ---
bind A display-popup -E -w 90% -h 90% 'git log --oneline'                  # Git log
bind U display-popup -E -w 90% -h 90% 'git add -A && git commit'           # Git add and commit
bind g popup -d '#{pane_current_path}' -E -w 90% -h 90% 'zsh -ic fshow'   # fshow (custom function) in popup

# --- Utility Popups ---
bind B display-popup -E -w 90% -h 90% 'bc'                                 # bc (calculator)
bind T display-popup -E -w 90% -h 90% 'zsh -ic t'                          # 't' (custom function) in popup
bind F display-popup -E -w 90% -h 90% 'cd ~ && vim requests.http'         # Edit http requests file
bind D display-popup -E -w 90% -h 90% 'cd ~/cheatsheets && vim .'         # Edit cheatsheets
bind W display-popup -E -w 90% -h 90% 'aichat'                             # AI Chat
bind C display-popup -E -w 90% -h 90% 'tmux new-session -A -s claude "cd $(pwd) && claude"' # Claude AI chat

# --- FZF Session Switchers ---
# Switch sessions in a new window
bind C-v new-window -n "session-switcher" "\
    tmux list-sessions -F '#{?session_attached,,#{session_name}}' |\
    sed '/^$/d' |\
    fzf --reverse --prompt=' ' --header=' Jump to Session' --preview 'tmux capture-pane -pt {}'  |\
    xargs tmux switch-client -t"

# Switch sessions in a popup
bind C-o display-popup -E -w 80% -h 60% "\
    tmux list-sessions -F '#{?session_attached,,#{session_name}}' |\
    sed '/^$/d' |\
    fzf --reverse --prompt=' ' --header=' Jump to Session' --preview 'tmux capture-pane -pt {}'  |\
    xargs tmux switch-client -t"

# ============================================================================
# 4. APPEARANCE & THEME
# ============================================================================

# --- Status Bar ---
set -g status "on"
set -g status-position bottom
set -g status-justify centre
set -g status-style "default"
set -g status-left-length 80
set -g status-right-length 120
set -g status-left "session #[fg=colour109,bold]#{session_name}#[default]"
set -g status-right "#{pomodoro_status}  win #[bold]#{window_index}#[nobold]/#{session_windows}  pane #[bold]#{pane_index}#[nobold]/#{window_panes}  #[fg=colour180]%H:%M#[default]  %d %b"

# --- Window Status ---
setw -g window-status-separator "#[fg=default] | "
setw -g window-status-format "#[fg=default]#W"
setw -g window-status-current-format "#[fg=colour71,bold]#W#[default]"

# --- Panes ---
set -g window-style "default"
set -g window-active-style "default"
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour66"

# --- Popups & Menus ---
# tmux 3.6+ ships themed defaults (bg=themedarkgrey) that paint an opaque
# background over the terminal; keep bg=default so popups stay transparent.
set -g popup-border-lines rounded
set -g popup-style "bg=default"
set -g popup-border-style "bg=default,fg=colour66"
set -g menu-style "bg=default"
set -g menu-border-style "bg=default,fg=colour66"
set -g menu-selected-style "bg=colour235,fg=colour255"

# --- Messages & Mode ---
set -g message-style "default"
set-window-option -g mode-style "bg=colour235,fg=colour255"

# --- Copy Mode ---
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection
bind-key -T copy-mode-vi Enter send-keys -X copy-selection
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection
bind-key -T copy-mode-vi 'q' send -X cancel # Use 'q' to exit copy mode

# ============================================================================
# 5. PLUGINS (Managed by TPM)
# ============================================================================

# --- Plugin Configurations ---

# t-smart-tmux-session-manager: Smart session management
set -g @t-fzf-prompt ' '

# tmux-fzf-url: Quickly open URLs from tmux
set -g @fzf-url-fzf-options '-p 60%,30% --prompt=" " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

# tmux-pomodoro-plus: A pomodoro timer in your status bar
set -g @pomodoro_on "#[fg=colour131]POMO: "
set -g @pomodoro_complete "#[fg=colour71]DONE: "
set -g @pomodoro_pause "#[fg=colour180]PAUSE: "
set -g @pomodoro_prompt_break "break"
set -g @pomodoro_prompt_pomodoro "start"
set -g @pomodoro_show_intervals "[%s/%s]"
set -g @pomodoro_granularity 'on'

# --- Plugin List ---
set -g @plugin 'tmux-plugins/tpm'                                # The plugin manager itself
set -g @plugin 'joshmedeski/t-smart-tmux-session-manager'         # Smart session management
set -g @plugin 'joshmedeski/tmux-fzf-url'                         # Open URLs with fzf
set -g @plugin 'junegunn/tmux-fzf-maccy'                          # Integrate Maccy (clipboard manager) with fzf
set -g @plugin 'olimorris/tmux-pomodoro-plus'                     # Pomodoro timer

# Initialize TMUX plugin manager (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
